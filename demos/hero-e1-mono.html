<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dark E1 — Monochrome</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,600;0,700;1,300;1,400;1,700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { font-family: 'Inter', sans-serif; background: #0A0A0A; color: #EDE9E2; }
a { text-decoration: none; color: inherit; }

/* No accent color — pure cream on black */
:root {
  --cream: #EDE9E2;
  --cream-dim: rgba(237,233,226,0.45);
  --cream-faint: rgba(237,233,226,0.12);
  --cream-ghost: rgba(237,233,226,0.05);
  --border: rgba(237,233,226,0.07);
}

.hero {
  min-height: 100svh;
  display: grid;
  grid-template-columns: 46% 54%;
}

/* Left: pure black */
.left {
  background: #050504;
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 2rem 2.5rem;
  position: relative;
  overflow: hidden;
}

/* Very faint horizontal rules like paper lines */
.left::before {
  content: '';
  position: absolute;
  inset: 0;
  background-image: repeating-linear-gradient(
    to bottom,
    transparent,
    transparent 79px,
    var(--cream-ghost) 79px,
    var(--cream-ghost) 80px
  );
  pointer-events: none;
}

.left-top {
  position: relative;
  z-index: 1;
}

.left-label {
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: var(--cream-dim);
  padding: 3px 8px;
  border: 1px solid var(--cream-faint);
  border-radius: 3px;
  display: inline-block;
}

.left-center {
  position: relative;
  z-index: 1;
}

/* Big brand name — white, no color */
.left-brand {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(5.5rem, 10vw, 10rem);
  font-weight: 700;
  color: var(--cream);
  letter-spacing: -0.02em;
  line-height: 0.88;
  writing-mode: vertical-rl;
  transform: rotate(180deg);
}

.left-bottom {
  position: relative;
  z-index: 1;
  display: flex;
  align-items: center;
  gap: 0.75rem;
}
.left-rule { width: 24px; height: 1px; background: var(--cream-dim); }
.left-city {
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--cream-dim);
}

/* Right: slightly lighter */
.right {
  background: #111110;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.right-header {
  padding: 1.75rem 2.5rem;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: flex-end;
  gap: 2rem;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--cream-dim);
}

.right-content {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  padding: 2rem 2.5rem 0;
}

.eyebrow {
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: var(--cream-dim);
  margin-bottom: 1.5rem;
  display: flex;
  align-items: center;
  gap: 0.75rem;
}
.eyebrow::before { content: ''; width: 18px; height: 1px; background: var(--cream-dim); }

.title {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(4rem, 7vw, 7.5rem);
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 0.9;
  color: var(--cream);
  margin-bottom: 1.75rem;
}
.title em {
  font-style: italic;
  font-weight: 300;
  display: block;
  color: var(--cream-dim);
}

.sub {
  font-size: 0.9375rem;
  color: var(--cream-dim);
  line-height: 1.7;
  max-width: 360px;
  font-weight: 300;
  margin-bottom: 2rem;
}

.ctas { display: flex; gap: 0.625rem; }

.btn-primary {
  padding: 0.875rem 2rem;
  background: var(--cream);
  color: #0A0A0A;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  border-radius: 5px;
  transition: opacity 0.15s;
}
.btn-primary:hover { opacity: 0.88; }

.btn-secondary {
  padding: 0.875rem 2rem;
  border: 1px solid var(--cream-faint);
  color: var(--cream-dim);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  border-radius: 5px;
  transition: border-color 0.15s;
}
.btn-secondary:hover { border-color: var(--cream-dim); }

.right-footer {
  padding: 1.25rem 2.5rem;
  border-top: 1px solid var(--border);
  margin-top: 2rem;
  display: flex;
  justify-content: space-between;
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: rgba(237,233,226,0.18);
}
</style>
</head>
<body>
<section class="hero">
  <div class="left">
    <div class="left-top"><span class="left-label">New collection</span></div>
    <div class="left-center"><div class="left-brand">OAKLET</div></div>
    <div class="left-bottom">
      <div class="left-rule"></div>
      <div class="left-city">Тула · 2021</div>
    </div>
  </div>

  <div class="right">
    <div class="right-header">
      <a href="#">Каталог</a><a href="#">О бренде</a><a href="#">Контакты</a>
    </div>
    <div class="right-content">
      <div class="eyebrow">Streetwear · Russia</div>
      <h1 class="title">Для<br><em>тульских.</em></h1>
      <p class="sub">Бренд одежды, вдохновлённый историей города. Ограниченные тиражи — только онлайн.</p>
      <div class="ctas">
        <a href="#" class="btn-primary">Каталог →</a>
        <a href="#" class="btn-secondary">О бренде</a>
      </div>
    </div>
    <div class="right-footer">
      <span>OAKLET · Тула · Россия</span>
      <span>Since 2021</span>
    </div>
  </div>
</section>
</body>
</html>
