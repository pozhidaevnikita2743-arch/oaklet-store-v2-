<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dark E4 — Wine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,600;0,700;1,300;1,400;1,700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { font-family: 'Inter', sans-serif; background: #0D0A0B; color: #EAE0E4; }
a { text-decoration: none; color: inherit; }

/* Deep wine / dusty rose accent */
:root {
  --accent: #B06070;          /* muted wine-rose */
  --accent-warm: #C07080;
  --accent-dim: rgba(176,96,112,0.15);
  --accent-glow: rgba(176,96,112,0.07);
  --text: #EAE0E4;
  --text-dim: rgba(234,224,228,0.45);
  --text-faint: rgba(234,224,228,0.18);
  --border: rgba(234,224,228,0.07);
}

.hero {
  min-height: 100svh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
}

/* Warm wine glow center-right */
.hero::before {
  content: '';
  position: absolute;
  top: 20%;
  right: 0;
  width: 50vw;
  height: 60vw;
  background: radial-gradient(ellipse, var(--accent-glow) 0%, transparent 65%);
  pointer-events: none;
}

/* Very subtle background texture — horizontal bars */
.hero::after {
  content: '';
  position: absolute;
  inset: 0;
  background-image: repeating-linear-gradient(
    to bottom,
    transparent 0px,
    transparent 3px,
    rgba(234,224,228,0.01) 3px,
    rgba(234,224,228,0.01) 4px
  );
  pointer-events: none;
}

/* Header */
.header {
  position: relative;
  z-index: 2;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 1.875rem clamp(1.5rem, 5vw, 3.5rem);
  border-bottom: 1px solid var(--border);
}

.brand-wrap { display: flex; align-items: baseline; gap: 0.5rem; }

.brand-name {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.375rem;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--text);
}
.brand-dot { color: var(--accent); font-size: 0.75rem; line-height: 1; }

.nav {
  display: flex;
  gap: 2rem;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--text-faint);
}

/* Large content area */
.content {
  flex: 1;
  display: flex;
  align-items: flex-end;
  padding: 0 clamp(1.5rem, 5vw, 3.5rem) 0;
  position: relative;
  z-index: 2;
}

.content-inner {
  width: 100%;
  padding-bottom: 0;
}

.eyebrow {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 1.5rem;
  margin-top: 2.5rem;
  display: flex;
  align-items: center;
  gap: 0.75rem;
  opacity: 0.9;
}
.eyebrow::before { content: ''; width: 18px; height: 1px; background: var(--accent); }

/* Title: "Для" outlined, "тульских." filled wine */
.title {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(5.5rem, 14vw, 14rem);
  font-weight: 700;
  letter-spacing: -0.025em;
  line-height: 0.87;
  color: var(--text);
}

.title-2 {
  display: block;
  font-style: italic;
  font-weight: 300;
  color: var(--accent);
}

/* Bottom layout */
.bottom {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 2rem;
  padding: 2rem clamp(1.5rem, 5vw, 3.5rem) 0;
  position: relative;
  z-index: 2;
  flex-wrap: wrap;
}

.sub {
  font-size: 0.9375rem;
  color: var(--text-dim);
  line-height: 1.7;
  max-width: 380px;
  font-weight: 300;
}

.ctas { display: flex; gap: 0.625rem; flex-shrink: 0; }

.btn-primary {
  padding: 0.875rem 2rem;
  background: var(--accent);
  color: #0D0A0B;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  border-radius: 6px;
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  transition: background 0.15s;
}
.btn-primary:hover { background: var(--accent-warm); }

.btn-secondary {
  padding: 0.875rem 2rem;
  border: 1px solid var(--border);
  color: var(--text-dim);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  border-radius: 6px;
  transition: border-color 0.15s;
}
.btn-secondary:hover { border-color: var(--accent); }

.footer-strip {
  position: relative;
  z-index: 2;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 1.25rem clamp(1.5rem, 5vw, 3.5rem);
  border-top: 1px solid var(--border);
  margin-top: 2rem;
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--text-faint);
}

.scroll { display: flex; align-items: center; gap: 0.5rem; }
.scroll-line { width: 20px; height: 1px; background: var(--accent); opacity: 0.5; }
</style>
</head>
<body>
<section class="hero">
  <header class="header">
    <div class="brand-wrap">
      <span class="brand-name">OAKLET</span>
      <span class="brand-dot">●</span>
    </div>
    <nav class="nav">
      <a href="#">Каталог</a><a href="#">О бренде</a><a href="#">Контакты</a>
    </nav>
  </header>

  <div class="content">
    <div class="content-inner">
      <div class="eyebrow">Тула · Россия · Since 2021</div>
      <h1 class="title">
        Для<br>
        <span class="title-2">тульских.</span>
      </h1>
    </div>
  </div>

  <div class="bottom">
    <p class="sub">Одежда, вдохновлённая историей города. Создан теми, кто вырос здесь. Ограниченные тиражи — только онлайн.</p>
    <div class="ctas">
      <a href="#" class="btn-primary">Смотреть каталог →</a>
      <a href="#" class="btn-secondary">О бренде</a>
    </div>
  </div>

  <div class="footer-strip">
    <span>OAKLET · Тула · Streetwear · 2021</span>
    <div class="scroll"><div class="scroll-line"></div>Scroll</div>
  </div>
</section>
</body>
</html>
