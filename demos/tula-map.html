<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Карта Тулы</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#EDE7DA;
  --parchment:#F5EED8;
  --ink:#1C1710;
  --navy:#1E3A5F;
  --sienna:#7A4A2A;
  --forest:#2E5036;
  --water:#5A8FA8;
  --gold:#C9A84C;
  --muted:#8A7E6E;
  --border:#C8B89A;
}

body{
  font-family:'Inter',sans-serif;
  background:var(--bg);
  color:var(--ink);
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

.wrapper{
  width:100vw;
  height:100vh;
  display:flex;
  flex-direction:column;
  padding:20px 32px 12px;
  gap:12px;
}

.header{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  flex-shrink:0;
}

.header-left{}
.eyebrow{
  font-size:10px;
  font-weight:600;
  letter-spacing:0.22em;
  text-transform:uppercase;
  color:var(--muted);
  margin-bottom:4px;
}
.title{
  font-family:'Playfair Display',serif;
  font-size:clamp(1.6rem,3vw,2.8rem);
  font-weight:700;
  color:var(--ink);
  line-height:1;
}
.title em{font-style:italic;color:var(--navy);}

.header-right{
  text-align:right;
  font-size:11px;
  color:var(--muted);
  line-height:1.7;
}

/* Map SVG container */
.map-wrap{
  flex:1;
  position:relative;
  border:1px solid var(--border);
  border-radius:4px;
  overflow:hidden;
  background:var(--parchment);
  box-shadow:inset 0 0 60px rgba(160,130,80,0.12);
}

/* Vignette */
.map-wrap::after{
  content:'';
  position:absolute;
  inset:0;
  background:radial-gradient(ellipse at center, transparent 60%, rgba(100,80,40,0.15) 100%);
  pointer-events:none;
  z-index:10;
}

#map{width:100%;height:100%;}

/* Tooltip */
.tooltip{
  position:absolute;
  pointer-events:none;
  z-index:50;
  opacity:0;
  transition:opacity 0.2s ease;
}
.tooltip.visible{opacity:1;}
.tooltip-inner{
  background:var(--ink);
  color:#F5EED8;
  padding:10px 14px;
  border-radius:4px;
  font-size:12px;
  line-height:1.5;
  max-width:200px;
  box-shadow:0 8px 24px rgba(0,0,0,0.25);
  position:relative;
}
.tooltip-inner::after{
  content:'';
  position:absolute;
  bottom:-6px;
  left:50%;
  transform:translateX(-50%);
  border:6px solid transparent;
  border-top-color:var(--ink);
  border-bottom:none;
}
.tooltip-name{
  font-weight:600;
  font-size:13px;
  margin-bottom:3px;
  color:var(--gold);
}

.legend{
  display:flex;
  gap:24px;
  flex-shrink:0;
  padding:4px 0 4px;
  flex-wrap:wrap;
}
.legend-item{
  display:flex;
  align-items:center;
  gap:6px;
  font-size:11px;
  color:var(--muted);
}
.legend-dot{
  width:8px;height:8px;border-radius:50%;flex-shrink:0;
}

/* SVG animations */
@keyframes drawPath{
  from{stroke-dashoffset:var(--len,3000);}
  to{stroke-dashoffset:0;}
}
@keyframes fadeUp{
  from{opacity:0;transform:translateY(6px);}
  to{opacity:1;transform:translateY(0);}
}
@keyframes pulse{
  0%,100%{r:6;opacity:1;}
  50%{r:11;opacity:0;}
}
@keyframes pulseRing{
  0%{stroke-width:2;opacity:0.8;r:8;}
  100%{stroke-width:0;opacity:0;r:22;}
}
@keyframes markerPop{
  0%{transform:scale(0);opacity:0;}
  70%{transform:scale(1.2);}
  100%{transform:scale(1);opacity:1;}
}
</style>
</head>
<body>
<div class="wrapper">
  <div class="header">
    <div class="header-left">
      <div class="eyebrow">Oaklet · Тульский бренд</div>
      <h1 class="title">Карта <em>Тулы</em></h1>
    </div>
    <div class="header-right">
      Основана в 1146 году<br>
      Население: ~450 000 чел.
    </div>
  </div>

  <div class="map-wrap" id="mapWrap">
    <svg id="map" viewBox="0 0 960 560" preserveAspectRatio="xMidYMid meet">
      <defs>
        <filter id="paper">
          <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch" result="noise"/>
          <feColorMatrix type="saturate" values="0" in="noise" result="grayNoise"/>
          <feBlend in="SourceGraphic" in2="grayNoise" mode="multiply" result="blend"/>
          <feComposite in="blend" in2="SourceGraphic" operator="in"/>
        </filter>
        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
          <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#C8B89A" stroke-width="0.4" opacity="0.5"/>
        </pattern>
        <!-- Glow filter for markers -->
        <filter id="glow">
          <feGaussianBlur stdDeviation="3" result="blur"/>
          <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <!-- Marker gradient -->
        <radialGradient id="markerGrad" cx="50%" cy="35%" r="50%">
          <stop offset="0%" stop-color="#4A7AB0"/>
          <stop offset="100%" stop-color="#1E3A5F"/>
        </radialGradient>
        <!-- Special marker for Kremlin -->
        <radialGradient id="kremlinGrad" cx="50%" cy="35%" r="50%">
          <stop offset="0%" stop-color="#D4A844"/>
          <stop offset="100%" stop-color="#8B6420"/>
        </radialGradient>
      </defs>

      <!-- Background grid -->
      <rect width="960" height="560" fill="url(#grid)"/>

      <!-- Forest areas -->
      <g opacity="0" style="animation:fadeUp 1s ease 0.2s forwards">
        <!-- Zasechniy les (north) -->
        <ellipse cx="130" cy="120" rx="90" ry="55" fill="#2E5036" opacity="0.08"/>
        <ellipse cx="140" cy="115" rx="70" ry="40" fill="#2E5036" opacity="0.07"/>
        <!-- Tree symbols -->
        <g fill="#2E5036" opacity="0.4">
          <path d="M 90,145 L 100,115 L 110,145Z" transform="scale(0.7) translate(-30,30)"/>
          <path d="M 110,148 L 122,116 L 134,148Z" transform="scale(0.8) translate(-10,15)"/>
          <path d="M 130,142 L 143,108 L 156,142Z" transform="scale(0.75) translate(0,18)"/>
        </g>
        <text x="90" y="80" font-family="Playfair Display,serif" font-size="10" font-style="italic" fill="#2E5036" opacity="0.6" text-anchor="middle">Засечный лес</text>

        <!-- Park near Vosstaniya square -->
        <ellipse cx="310" cy="185" rx="45" ry="28" fill="#2E5036" opacity="0.08"/>
      </g>

      <!-- ROADS / Streets -->
      <g stroke="#BCA885" fill="none" opacity="0" style="animation:fadeUp 1.2s ease 0.4s forwards">
        <!-- Main roads (thicker) -->
        <path d="M 0,280 L 960,280" stroke-width="2.5" stroke="#C4B090" opacity="0.5"/>
        <path d="M 0,350 L 960,365" stroke-width="1.5" stroke="#BCA885" opacity="0.4"/>
        <path d="M 430,0 L 440,560" stroke-width="2" stroke="#C4B090" opacity="0.4"/>
        <path d="M 300,0 L 290,560" stroke-width="1.2" opacity="0.4"/>
        <path d="M 600,0 L 605,560" stroke-width="1.2" opacity="0.4"/>
        <!-- Secondary streets -->
        <path d="M 0,200 L 960,205" stroke-width="0.8" opacity="0.3"/>
        <path d="M 0,430 L 960,440" stroke-width="0.8" opacity="0.3"/>
        <path d="M 0,120 L 960,115" stroke-width="0.6" opacity="0.25"/>
        <path d="M 170,0 L 165,560" stroke-width="0.8" opacity="0.3"/>
        <path d="M 760,0 L 755,560" stroke-width="0.8" opacity="0.3"/>
        <path d="M 500,0 L 510,560" stroke-width="0.6" opacity="0.25"/>
        <!-- Diagonal roads -->
        <path d="M 0,560 L 400,0" stroke-width="0.8" opacity="0.2"/>
        <path d="M 300,560 L 800,0" stroke-width="0.8" opacity="0.2"/>
      </g>

      <!-- UPA RIVER -->
      <g opacity="0" style="animation:fadeUp 1s ease 0.8s forwards">
        <!-- River body -->
        <path id="river-path"
          d="M -10,395 C 60,392 120,388 200,380 C 280,372 340,368 420,365 C 500,362 560,358 640,352 C 720,346 800,340 880,338 C 920,337 950,336 970,336"
          fill="none" stroke="#5A8FA8" stroke-width="14" stroke-linecap="round"
          stroke-dasharray="3000" stroke-dashoffset="3000"
          style="animation:drawPath 2.5s ease 1s forwards; --len:3000"/>
        <!-- River shimmer -->
        <path
          d="M -10,395 C 60,392 120,388 200,380 C 280,372 340,368 420,365 C 500,362 560,358 640,352 C 720,346 800,340 880,338 C 920,337 950,336 970,336"
          fill="none" stroke="#7AAFCC" stroke-width="6" stroke-linecap="round" opacity="0.5"
          stroke-dasharray="3000" stroke-dashoffset="3000"
          style="animation:drawPath 2.5s ease 1.2s forwards; --len:3000"/>
        <!-- River label -->
        <text opacity="0" style="animation:fadeUp 0.5s ease 3.5s forwards">
          <textPath href="#river-path" startOffset="28%"
            font-family="Playfair Display,serif" font-size="12" font-style="italic"
            fill="#4A7A96" letter-spacing="3">
            р е к а   У п а
          </textPath>
        </text>
      </g>

      <!-- LOCATION MARKERS (appear after river) -->
      <!-- 1. Kremlin (main, gold) -->
      <g class="marker-group" data-name="Тульский кремль" data-desc="Белокаменный кремль 1520 г. Символ города и один из лучших кремлей России." data-x="430" data-y="330" transform="translate(430, 330)" opacity="0" style="animation:markerPop 0.5s cubic-bezier(0.34,1.56,0.64,1) 3.2s forwards">
        <!-- Pulse rings -->
        <circle r="8" fill="none" stroke="#C9A84C" stroke-width="2" opacity="0.9">
          <animate attributeName="r" values="8;26;8" dur="2.4s" repeatCount="indefinite" begin="3.5s"/>
          <animate attributeName="opacity" values="0.9;0;0.9" dur="2.4s" repeatCount="indefinite" begin="3.5s"/>
        </circle>
        <circle r="8" fill="none" stroke="#C9A84C" stroke-width="1.5" opacity="0.6">
          <animate attributeName="r" values="8;20;8" dur="2.4s" repeatCount="indefinite" begin="4.1s"/>
          <animate attributeName="opacity" values="0.6;0;0.6" dur="2.4s" repeatCount="indefinite" begin="4.1s"/>
        </circle>
        <!-- Main dot -->
        <circle r="8" fill="url(#kremlinGrad)" filter="url(#glow)"/>
        <circle r="3.5" fill="#FFF7E0"/>
        <!-- Tower icon -->
        <rect x="-5" y="-16" width="10" height="12" fill="#8B6420" rx="1"/>
        <rect x="-7" y="-17" width="3" height="3" fill="#8B6420"/>
        <rect x="-2" y="-17" width="3" height="3" fill="#8B6420"/>
        <rect x="3" y="-17" width="3" height="3" fill="#8B6420"/>
        <!-- Label -->
        <text x="14" y="-8" font-family="Inter,sans-serif" font-size="12" font-weight="600" fill="#1C1710">Тульский кремль</text>
        <text x="14" y="5" font-family="Inter,sans-serif" font-size="10" fill="#8A7E6E">1520</text>
      </g>

      <!-- 2. Arms factory -->
      <g class="marker-group" data-name="Оружейный завод" data-desc="Указ Петра I 1712 г. Главный оружейный завод России. Здесь же — музей «Тульский государственный музей оружия»." data-x="640" data-y="395" transform="translate(640, 395)" opacity="0" style="animation:markerPop 0.5s cubic-bezier(0.34,1.56,0.64,1) 3.5s forwards">
        <circle r="7" fill="none" stroke="#1E3A5F" stroke-width="2">
          <animate attributeName="r" values="7;20;7" dur="3s" repeatCount="indefinite" begin="4s"/>
          <animate attributeName="opacity" values="0.8;0;0.8" dur="3s" repeatCount="indefinite" begin="4s"/>
        </circle>
        <circle r="7" fill="url(#markerGrad)" filter="url(#glow)"/>
        <circle r="3" fill="white" opacity="0.8"/>
        <text x="12" y="-5" font-family="Inter,sans-serif" font-size="11" font-weight="600" fill="#1C1710">Оружейный завод</text>
        <text x="12" y="7" font-family="Inter,sans-serif" font-size="10" fill="#8A7E6E">с 1712 г.</text>
      </g>

      <!-- 3. Railway station -->
      <g class="marker-group" data-name="ЖД Станция Тула" data-desc="Тульский железнодорожный вокзал. Ворота города — отсюда начинается путь в Тулу из любой точки страны." data-x="200" data-y="200" transform="translate(200, 200)" opacity="0" style="animation:markerPop 0.5s cubic-bezier(0.34,1.56,0.64,1) 3.8s forwards">
        <circle r="6" fill="none" stroke="#1E3A5F" stroke-width="1.8">
          <animate attributeName="r" values="6;18;6" dur="3.5s" repeatCount="indefinite" begin="4.5s"/>
          <animate attributeName="opacity" values="0.8;0;0.8" dur="3.5s" repeatCount="indefinite" begin="4.5s"/>
        </circle>
        <circle r="6" fill="url(#markerGrad)"/>
        <circle r="2.5" fill="white" opacity="0.8"/>
        <text x="-80" y="-10" font-family="Inter,sans-serif" font-size="11" font-weight="600" fill="#1C1710">ЖД Вокзал</text>
        <text x="-80" y="3" font-family="Inter,sans-serif" font-size="10" fill="#8A7E6E">с 1868 г.</text>
      </g>

      <!-- 4. Iskra space -->
      <g class="marker-group" data-name="Пространство «Искра»" data-desc="Молодёжное городское пространство. Место коллабораций OAKLET — показы, встречи, творчество." data-x="490" data-y="245" transform="translate(490, 245)" opacity="0" style="animation:markerPop 0.5s cubic-bezier(0.34,1.56,0.64,1) 4.1s forwards">
        <circle r="6" fill="none" stroke="#5A8A4A" stroke-width="1.8">
          <animate attributeName="r" values="6;18;6" dur="2.8s" repeatCount="indefinite" begin="4.8s"/>
          <animate attributeName="opacity" values="0.9;0;0.9" dur="2.8s" repeatCount="indefinite" begin="4.8s"/>
        </circle>
        <circle r="6" fill="#4A7A3A"/>
        <circle r="2.5" fill="white" opacity="0.8"/>
        <text x="12" y="-5" font-family="Inter,sans-serif" font-size="11" font-weight="600" fill="#1C1710">«Искра»</text>
        <text x="12" y="7" font-family="Inter,sans-serif" font-size="10" fill="#4A7A3A">коллаборация</text>
      </g>

      <!-- 5. Park -->
      <g class="marker-group" data-name="Парк им. Белоусова" data-desc="Главный городской парк Тулы. Бывший дворянский парк XIX века — место прогулок и отдыха." data-x="310" data-y="185" transform="translate(310, 185)" opacity="0" style="animation:markerPop 0.5s cubic-bezier(0.34,1.56,0.64,1) 4.4s forwards">
        <circle r="5" fill="none" stroke="#2E5036" stroke-width="1.5">
          <animate attributeName="r" values="5;14;5" dur="4s" repeatCount="indefinite" begin="5s"/>
          <animate attributeName="opacity" values="0.8;0;0.8" dur="4s" repeatCount="indefinite" begin="5s"/>
        </circle>
        <circle r="5" fill="#2E5036"/>
        <circle r="2" fill="white" opacity="0.7"/>
        <text x="-70" y="-8" font-family="Inter,sans-serif" font-size="11" font-weight="500" fill="#1C1710">Парк Белоусова</text>
      </g>

      <!-- 6. Yasnaya Polyana (distant, dashed line) -->
      <g opacity="0" style="animation:fadeUp 0.6s ease 5s forwards">
        <line x1="430" y1="330" x2="195" y2="495" stroke="#8A7E6E" stroke-width="1" stroke-dasharray="5,4" opacity="0.4"/>
        <circle cx="195" cy="495" r="5" fill="#7A4A2A"/>
        <circle cx="195" cy="495" r="5" fill="none" stroke="#7A4A2A" stroke-width="1.5">
          <animate attributeName="r" values="5;14;5" dur="4s" repeatCount="indefinite" begin="5.5s"/>
          <animate attributeName="opacity" values="0.8;0;0.8" dur="4s" repeatCount="indefinite" begin="5.5s"/>
        </circle>
        <text x="60" y="510" font-family="Playfair Display,serif" font-size="12" font-style="italic" fill="#7A4A2A" font-weight="700">Ясная Поляна</text>
        <text x="60" y="523" font-family="Inter,sans-serif" font-size="10" fill="#8A7E6E">14 км · усадьба Толстого</text>
      </g>

      <!-- 7. Kulikovo pole (compass direction) -->
      <g opacity="0" style="animation:fadeUp 0.6s ease 5.3s forwards">
        <line x1="640" y1="395" x2="870" y2="495" stroke="#8A7E6E" stroke-width="1" stroke-dasharray="4,4" opacity="0.35"/>
        <text x="755" y="510" font-family="Playfair Display,serif" font-size="11" font-style="italic" fill="#8A7E6E" text-anchor="middle">Куликово поле</text>
        <text x="755" y="522" font-family="Inter,sans-serif" font-size="10" fill="#8A7E6E" text-anchor="middle">80 км · 1380 г.</text>
      </g>

      <!-- Compass rose (bottom right) -->
      <g transform="translate(880, 480)" opacity="0" style="animation:fadeUp 0.8s ease 5.5s forwards">
        <circle r="26" fill="none" stroke="#C8B89A" stroke-width="1"/>
        <circle r="2" fill="#8A7E6E"/>
        <!-- N arrow -->
        <polygon points="0,-22 -3,-8 3,-8" fill="#1E3A5F"/>
        <polygon points="0,22 -3,8 3,8" fill="#C8B89A"/>
        <polygon points="-22,0 -8,-3 -8,3" fill="#C8B89A"/>
        <polygon points="22,0 8,-3 8,3" fill="#C8B89A"/>
        <text x="0" y="-28" text-anchor="middle" font-size="10" font-weight="700" fill="#1E3A5F" font-family="Inter,sans-serif">С</text>
        <text x="0" y="38" text-anchor="middle" font-size="10" fill="#8A7E6E" font-family="Inter,sans-serif">Ю</text>
        <text x="-32" y="4" text-anchor="middle" font-size="10" fill="#8A7E6E" font-family="Inter,sans-serif">З</text>
        <text x="32" y="4" text-anchor="middle" font-size="10" fill="#8A7E6E" font-family="Inter,sans-serif">В</text>
      </g>

      <!-- Scale bar -->
      <g transform="translate(50, 515)" opacity="0" style="animation:fadeUp 0.5s ease 6s forwards">
        <line x1="0" y1="0" x2="100" y2="0" stroke="#8A7E6E" stroke-width="1.5"/>
        <line x1="0" y1="-4" x2="0" y2="4" stroke="#8A7E6E" stroke-width="1.5"/>
        <line x1="100" y1="-4" x2="100" y2="4" stroke="#8A7E6E" stroke-width="1.5"/>
        <text x="50" y="-8" text-anchor="middle" font-size="10" fill="#8A7E6E" font-family="Inter,sans-serif">5 км</text>
      </g>

      <!-- Year badge -->
      <g transform="translate(870, 30)" opacity="0" style="animation:fadeUp 0.5s ease 6.2s forwards">
        <rect x="-50" y="-15" width="100" height="30" rx="2" fill="none" stroke="#C8B89A" stroke-width="1"/>
        <text x="0" y="5" text-anchor="middle" font-family="Playfair Display,serif" font-size="16" font-weight="700" fill="#1E3A5F">1146</text>
      </g>
    </svg>

    <!-- Tooltip -->
    <div class="tooltip" id="tooltip">
      <div class="tooltip-inner">
        <div class="tooltip-name" id="tooltipName"></div>
        <div id="tooltipDesc"></div>
      </div>
    </div>
  </div>

  <div class="legend">
    <div class="legend-item">
      <div class="legend-dot" style="background:#C9A844"></div>
      <span>Исторические памятники</span>
    </div>
    <div class="legend-item">
      <div class="legend-dot" style="background:#1E3A5F"></div>
      <span>Промышленность и инфраструктура</span>
    </div>
    <div class="legend-item">
      <div class="legend-dot" style="background:#2E5036"></div>
      <span>Парки и природа</span>
    </div>
    <div class="legend-item">
      <div class="legend-dot" style="background:#4A7A3A"></div>
      <span>Места бренда OAKLET</span>
    </div>
    <div class="legend-item">
      <div class="legend-dot" style="background:#7A4A2A"></div>
      <span>За городом</span>
    </div>
  </div>
</div>

<script>
const tooltip = document.getElementById('tooltip');
const tooltipName = document.getElementById('tooltipName');
const tooltipDesc = document.getElementById('tooltipDesc');
const mapWrap = document.getElementById('mapWrap');

document.querySelectorAll('.marker-group').forEach(g => {
  g.addEventListener('mouseenter', (e) => {
    const rect = mapWrap.getBoundingClientRect();
    const x = parseFloat(g.dataset.x);
    const y = parseFloat(g.dataset.y);
    const svg = document.getElementById('map');
    const svgRect = svg.getBoundingClientRect();
    const scaleX = svgRect.width / 960;
    const scaleY = svgRect.height / 560;
    const px = x * scaleX + svgRect.left - rect.left;
    const py = y * scaleY + svgRect.top - rect.top;

    tooltipName.textContent = g.dataset.name;
    tooltipDesc.textContent = g.dataset.desc;
    tooltip.style.left = (px - 100) + 'px';
    tooltip.style.top = (py - 110) + 'px';
    tooltip.classList.add('visible');
    g.style.cursor = 'pointer';
  });

  g.addEventListener('mouseleave', () => {
    tooltip.classList.remove('visible');
  });
});
</script>
</body>
</html>
