<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dark E2 — Steel Blue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,600;0,700;1,300;1,400;1,700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { font-family: 'Inter', sans-serif; background: #0C0E12; color: #DDE4EC; }
a { text-decoration: none; color: inherit; }

/* Cool steel blue accent */
:root {
  --accent: #6B9AB8;          /* muted steel blue */
  --accent-dim: rgba(107,154,184,0.18);
  --accent-glow: rgba(107,154,184,0.06);
  --text: #DDE4EC;
  --text-dim: rgba(221,228,236,0.45);
  --text-faint: rgba(221,228,236,0.18);
  --border: rgba(221,228,236,0.07);
  --bg: #0C0E12;
  --bg2: #12151A;
}

.hero {
  min-height: 100svh;
  display: flex;
  flex-direction: column;
  position: relative;
  overflow: hidden;
}

/* Cold blue ambient glow — top right */
.hero::before {
  content: '';
  position: absolute;
  top: -15%;
  right: -5%;
  width: 55vw;
  height: 55vw;
  background: radial-gradient(ellipse, rgba(107,154,184,0.07) 0%, transparent 60%);
  pointer-events: none;
  z-index: 0;
}

/* Header */
.header {
  position: relative;
  z-index: 2;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 1.875rem clamp(1.5rem, 5vw, 3.5rem);
  border-bottom: 1px solid var(--border);
}

.brand { display: flex; align-items: center; gap: 0.5rem; }

.brand-name {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.375rem;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--text);
}

.brand-tag {
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--accent);
  border: 1px solid rgba(107,154,184,0.3);
  padding: 2px 7px;
  border-radius: 3px;
}

.nav {
  display: flex;
  gap: 2rem;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--text-faint);
}

/* Main body */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  padding: 0 clamp(1.5rem, 5vw, 3.5rem) 0;
  position: relative;
  z-index: 2;
}

/* Accent line */
.accent-bar {
  width: 40px;
  height: 2px;
  background: var(--accent);
  margin-bottom: 1.5rem;
  margin-top: 2.5rem;
  opacity: 0.75;
}

.eyebrow {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--accent);
  opacity: 0.85;
  margin-bottom: 1.5rem;
}

.title {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(5.5rem, 14vw, 13.5rem);
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 0.87;
  color: var(--text);
}

.title em {
  display: block;
  font-style: italic;
  font-weight: 300;
  color: var(--accent);
}

/* Background ghost text */
.bg-text {
  position: absolute;
  right: -0.04em;
  bottom: -0.1em;
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(13rem, 26vw, 28rem);
  font-weight: 700;
  letter-spacing: -0.04em;
  line-height: 1;
  color: transparent;
  -webkit-text-stroke: 1px rgba(107,154,184,0.1);
  user-select: none;
  pointer-events: none;
  z-index: 1;
}

.main > *:not(.bg-text) { position: relative; z-index: 2; }

/* Bottom row */
.bottom {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 2rem;
  padding: 2rem clamp(1.5rem, 5vw, 3.5rem) 0;
  position: relative;
  z-index: 2;
  flex-wrap: wrap;
}

.sub {
  font-size: 0.9375rem;
  color: var(--text-dim);
  line-height: 1.7;
  max-width: 380px;
  font-weight: 300;
}

.ctas { display: flex; gap: 0.625rem; flex-shrink: 0; }

.btn-primary {
  padding: 0.875rem 2rem;
  background: var(--accent);
  color: #0C0E12;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  border-radius: 6px;
  transition: opacity 0.15s;
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
}
.btn-primary:hover { opacity: 0.88; }

.btn-secondary {
  padding: 0.875rem 2rem;
  border: 1px solid var(--border);
  color: var(--text-dim);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  border-radius: 6px;
  transition: border-color 0.15s;
}
.btn-secondary:hover { border-color: var(--accent); }

.footer-strip {
  position: relative;
  z-index: 2;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 1.25rem clamp(1.5rem, 5vw, 3.5rem);
  border-top: 1px solid var(--border);
  margin-top: 2rem;
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--text-faint);
}

.scroll { display: flex; align-items: center; gap: 0.5rem; }
.scroll-line { width: 20px; height: 1px; background: var(--accent); opacity: 0.5; }
</style>
</head>
<body>
<section class="hero">
  <header class="header">
    <div class="brand">
      <span class="brand-name">OAKLET</span>
      <span class="brand-tag">Тула</span>
    </div>
    <nav class="nav">
      <a href="#">Каталог</a><a href="#">О бренде</a><a href="#">Контакты</a>
    </nav>
  </header>

  <div class="main">
    <div class="bg-text">OAKLET</div>
    <div class="accent-bar"></div>
    <div class="eyebrow">Тула · Россия · Since 2021</div>
    <h1 class="title">Для<br><em>тульских.</em></h1>
  </div>

  <div class="bottom">
    <p class="sub">Бренд одежды, вдохновлённый историей города. Ограниченные тиражи — продажа через ВК и Telegram.</p>
    <div class="ctas">
      <a href="#" class="btn-primary">Смотреть каталог →</a>
      <a href="#" class="btn-secondary">О бренде</a>
    </div>
  </div>

  <div class="footer-strip">
    <span>OAKLET · Тула · Streetwear · 2021</span>
    <div class="scroll"><div class="scroll-line"></div>Scroll</div>
  </div>
</section>
</body>
</html>
