<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dark V2 — Glow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,600;0,700;1,300;1,400;1,700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { font-family: 'Inter', sans-serif; background: #0A0A0A; color: #F0EDE6; }
a { text-decoration: none; color: inherit; }

.hero {
  min-height: 100svh;
  display: flex;
  flex-direction: column;
  position: relative;
  overflow: hidden;
}

/* Warm orange glow — bottom left corner */
.glow {
  position: absolute;
  bottom: -20%;
  left: -10%;
  width: 70vw;
  height: 70vw;
  background: radial-gradient(ellipse, rgba(196,123,58,0.11) 0%, rgba(196,123,58,0.04) 35%, transparent 65%);
  pointer-events: none;
  z-index: 0;
}

/* Secondary faint glow — top right */
.glow2 {
  position: absolute;
  top: -15%;
  right: -10%;
  width: 50vw;
  height: 50vw;
  background: radial-gradient(ellipse, rgba(196,123,58,0.04) 0%, transparent 60%);
  pointer-events: none;
  z-index: 0;
}

/* Header */
.header {
  position: relative;
  z-index: 2;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 1.875rem clamp(1.5rem, 5vw, 3.5rem);
  border-bottom: 1px solid rgba(240,237,230,0.06);
}

.brand {
  display: flex;
  align-items: baseline;
  gap: 0.5rem;
}

.brand-name {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.375rem;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: #F0EDE6;
}

.brand-tag {
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: #C47B3A;
  border: 1px solid rgba(196,123,58,0.35);
  padding: 2px 7px;
  border-radius: 3px;
}

.nav {
  display: flex;
  gap: 2rem;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: rgba(240,237,230,0.4);
}

/* Main */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  padding: 3rem clamp(1.5rem, 5vw, 3.5rem) 0;
  position: relative;
  z-index: 2;
}

.eyebrow {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: #C47B3A;
  margin-bottom: 1.75rem;
  display: flex;
  align-items: center;
  gap: 0.75rem;
}
.eyebrow-dot { width: 4px; height: 4px; background: #C47B3A; border-radius: 50%; flex-shrink: 0; }

.title {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(5.5rem, 14vw, 13.5rem);
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 0.87;
  color: #F0EDE6;
  margin-bottom: 0;
}

/* "тульских." gets the orange glow treatment */
.title-accent {
  display: block;
  font-style: italic;
  font-weight: 300;
  color: #F0EDE6;
  position: relative;
}

/* Orange underline for "тульских." */
.title-accent::after {
  content: '';
  position: absolute;
  bottom: 0.08em;
  left: 0;
  width: 60%;
  height: 2px;
  background: linear-gradient(to right, #C47B3A, transparent);
}

/* Bottom section */
.bottom {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 2rem;
  padding: 2rem clamp(1.5rem, 5vw, 3.5rem) 0;
  flex-wrap: wrap;
  position: relative;
  z-index: 2;
}

.sub {
  font-size: 0.9375rem;
  color: rgba(240,237,230,0.5);
  line-height: 1.7;
  max-width: 380px;
  font-weight: 300;
}

.ctas {
  display: flex;
  gap: 0.625rem;
  flex-shrink: 0;
}

.btn-primary {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.875rem 2rem;
  background: #C47B3A;
  color: #0A0A0A;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  border-radius: 6px;
  transition: background 0.15s;
}
.btn-primary:hover { background: #D4894A; }

.btn-secondary {
  display: inline-flex;
  align-items: center;
  padding: 0.875rem 2rem;
  border: 1px solid rgba(240,237,230,0.1);
  color: rgba(240,237,230,0.45);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  border-radius: 6px;
  transition: border-color 0.15s, color 0.15s;
}
.btn-secondary:hover { border-color: rgba(196,123,58,0.5); color: rgba(196,123,58,0.9); }

/* Footer strip */
.footer-strip {
  position: relative;
  z-index: 2;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 1.25rem clamp(1.5rem, 5vw, 3.5rem);
  border-top: 1px solid rgba(240,237,230,0.06);
  margin-top: 2rem;
}

.strip-meta {
  display: flex;
  gap: 1.25rem;
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: rgba(240,237,230,0.2);
}

.scroll-hint {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  font-size: 9px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: rgba(240,237,230,0.2);
}
.scroll-line { width: 24px; height: 1px; background: rgba(196,123,58,0.4); }
</style>
</head>
<body>
<section class="hero">
  <div class="glow"></div>
  <div class="glow2"></div>

  <header class="header">
    <div class="brand">
      <span class="brand-name">OAKLET</span>
      <span class="brand-tag">Тула</span>
    </div>
    <nav class="nav">
      <a href="#">Каталог</a>
      <a href="#">О бренде</a>
      <a href="#">Контакты</a>
    </nav>
  </header>

  <div class="main">
    <div class="eyebrow">
      <div class="eyebrow-dot"></div>
      Тула · Россия · Since 2021
    </div>
    <h1 class="title">
      Для<br>
      <span class="title-accent">тульских.</span>
    </h1>
  </div>

  <div class="bottom">
    <p class="sub">
      Одежда, вдохновлённая историей города. Создан теми, кто вырос здесь. Ограниченные тиражи — только онлайн.
    </p>
    <div class="ctas">
      <a href="#" class="btn-primary">Смотреть каталог →</a>
      <a href="#" class="btn-secondary">О бренде</a>
    </div>
  </div>

  <div class="footer-strip">
    <div class="strip-meta">
      <span>OAKLET</span><span>·</span>
      <span>Тула</span><span>·</span>
      <span>Streetwear</span><span>·</span>
      <span>2021</span>
    </div>
    <div class="scroll-hint">
      <div class="scroll-line"></div>
      <span>Scroll</span>
    </div>
  </div>
</section>
</body>
</html>
