<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dark V5 — Full Width Type</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,600;0,700;1,300;1,400;1,700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { font-family: 'Inter', sans-serif; background: #0A0A0A; color: #F0EDE6; }
a { text-decoration: none; color: inherit; }

.hero {
  min-height: 100svh;
  display: flex;
  flex-direction: column;
  padding: 0 clamp(1.25rem, 4vw, 2.5rem);
  overflow: hidden;
  position: relative;
}

/* Top header */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 1.5rem 0;
  border-bottom: 1px solid rgba(240,237,230,0.07);
  flex-shrink: 0;
}

.brand {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.25rem;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: #F0EDE6;
}

/* Orange dot accent */
.brand-dot {
  width: 6px;
  height: 6px;
  background: #C47B3A;
  border-radius: 50%;
}

.header-meta {
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: rgba(240,237,230,0.3);
  display: flex;
  gap: 1.25rem;
}

/* Big type block */
.type-block {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  position: relative;
  padding: 1rem 0 0;
}

/* First line: "Для" — large, filled white */
.word-1 {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(6rem, 18vw, 19rem);
  font-weight: 700;
  letter-spacing: -0.03em;
  line-height: 0.88;
  color: #F0EDE6;
  display: block;
}

/* Second line: "тульских." — orange, italic */
.word-2 {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(6rem, 18vw, 19rem);
  font-weight: 300;
  font-style: italic;
  letter-spacing: -0.02em;
  line-height: 0.88;
  color: #C47B3A;
  display: block;
  /* Outline instead of fill on second pass */
}

/* Thin orange rule */
.rule {
  height: 1px;
  background: rgba(196,123,58,0.25);
  margin-top: 1.75rem;
}

/* Bottom: sub + ctas */
.bottom {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 2rem;
  padding: 1.5rem 0 2rem;
  flex-wrap: wrap;
}

.bottom-left {}

.eyebrow {
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: rgba(240,237,230,0.3);
  margin-bottom: 0.625rem;
}

.sub {
  font-size: 0.9375rem;
  color: rgba(240,237,230,0.45);
  line-height: 1.65;
  max-width: 380px;
  font-weight: 300;
}

.ctas {
  display: flex;
  gap: 0.625rem;
  align-items: flex-end;
  flex-shrink: 0;
}

.btn-primary {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.875rem 2rem;
  background: #C47B3A;
  color: #0A0A0A;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  border-radius: 6px;
  transition: background 0.15s;
}
.btn-primary:hover { background: #D4894A; }

.btn-secondary {
  display: inline-flex;
  align-items: center;
  padding: 0.875rem 2rem;
  border: 1px solid rgba(240,237,230,0.1);
  color: rgba(240,237,230,0.4);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  border-radius: 6px;
  transition: border-color 0.15s, color 0.15s;
}
.btn-secondary:hover { border-color: rgba(196,123,58,0.4); color: rgba(196,123,58,0.8); }

/* Year badge — floating */
.year-badge {
  position: absolute;
  top: 1.5rem;
  right: 0;
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: rgba(196,123,58,0.5);
  border: 1px solid rgba(196,123,58,0.2);
  padding: 4px 10px;
  border-radius: 4px;
  background: rgba(196,123,58,0.05);
}
</style>
</head>
<body>
<section class="hero">
  <header class="header">
    <div class="brand">
      <div class="brand-dot"></div>
      OAKLET
    </div>
    <div class="header-meta">
      <span>Каталог</span>
      <span>О бренде</span>
      <span>Контакты</span>
    </div>
  </header>

  <div class="type-block">
    <div class="year-badge">Тула · 2021</div>
    <span class="word-1">Для</span>
    <span class="word-2">тульских.</span>
    <div class="rule"></div>
  </div>

  <div class="bottom">
    <div class="bottom-left">
      <div class="eyebrow">Тула · Россия · Streetwear · Since 2021</div>
      <p class="sub">
        Бренд одежды, вдохновлённый историей города. Ограниченные тиражи — продажа через ВК и Telegram.
      </p>
    </div>
    <div class="ctas">
      <a href="#" class="btn-primary">Каталог →</a>
      <a href="#" class="btn-secondary">О бренде</a>
    </div>
  </div>
</section>
</body>
</html>
