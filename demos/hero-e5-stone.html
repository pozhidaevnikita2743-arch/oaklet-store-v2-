<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dark E5 — Stone</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,600;0,700;1,300;1,400;1,700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { font-family: 'Inter', sans-serif; background: #111110; color: #E6E2DC; }
a { text-decoration: none; color: inherit; }

/* Warm stone / pebble — between cream and grey, no hue */
:root {
  --accent: #B8AFA4;          /* warm stone */
  --accent-bright: #CEC4B8;
  --text: #E6E2DC;
  --text-dim: rgba(230,226,220,0.45);
  --text-faint: rgba(230,226,220,0.2);
  --border: rgba(230,226,220,0.07);
  --border-strong: rgba(230,226,220,0.12);
}

.hero {
  min-height: 100svh;
  display: flex;
  flex-direction: column;
  position: relative;
  overflow: hidden;
}

/* Left side: pure black panel for depth */
.side-panel {
  position: absolute;
  top: 0;
  bottom: 0;
  left: 0;
  width: 5px;
  background: linear-gradient(to bottom,
    var(--accent) 0%,
    rgba(184,175,164,0.3) 40%,
    transparent 100%
  );
}

/* Header */
.header {
  position: relative;
  z-index: 2;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 1.875rem 2.5rem 1.875rem 3.5rem;
  border-bottom: 1px solid var(--border);
}

.brand {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.375rem;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--text);
}

.nav {
  display: flex;
  gap: 2rem;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--text-faint);
}

/* Two-zone layout: upper = big type, lower = content */
.upper {
  flex: 1;
  display: flex;
  align-items: center;
  padding: 2rem 2.5rem 0 3.5rem;
  position: relative;
  z-index: 2;
}

/* Ghost "OAKLET" — full height, behind content */
.bg-text {
  position: absolute;
  left: -0.04em;
  top: 50%;
  transform: translateY(-50%);
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(16rem, 34vw, 36rem);
  font-weight: 700;
  letter-spacing: -0.04em;
  line-height: 1;
  color: transparent;
  -webkit-text-stroke: 1px rgba(184,175,164,0.09);
  user-select: none;
  pointer-events: none;
  z-index: 0;
  white-space: nowrap;
}

.upper-content {
  position: relative;
  z-index: 2;
}

.eyebrow {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 1.5rem;
  display: flex;
  align-items: center;
  gap: 0.75rem;
}
.eyebrow::before { content: ''; width: 20px; height: 1px; background: var(--accent); opacity: 0.7; }

.title {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(5rem, 11vw, 11rem);
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 0.88;
  color: var(--text);
}

.title em {
  display: block;
  font-style: italic;
  font-weight: 300;
  color: var(--accent-bright);
}

/* Lower zone: separator + info */
.lower {
  position: relative;
  z-index: 2;
}

.separator {
  height: 1px;
  background: var(--border);
  margin: 0 3.5rem 0 3.5rem;
}

.lower-content {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 2rem;
  padding: 2rem 2.5rem 2rem 3.5rem;
  flex-wrap: wrap;
}

.sub {
  font-size: 0.9375rem;
  color: var(--text-dim);
  line-height: 1.7;
  max-width: 380px;
  font-weight: 300;
}

.right-col {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 1.25rem;
  flex-shrink: 0;
}

.ctas { display: flex; gap: 0.625rem; }

.btn-primary {
  padding: 0.875rem 2rem;
  background: var(--accent);
  color: #111110;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  border-radius: 5px;
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  transition: background 0.15s;
}
.btn-primary:hover { background: var(--accent-bright); }

.btn-secondary {
  padding: 0.875rem 2rem;
  border: 1px solid var(--border-strong);
  color: var(--text-dim);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  border-radius: 5px;
  transition: border-color 0.15s;
}
.btn-secondary:hover { border-color: var(--accent); }

.meta {
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--text-faint);
  display: flex;
  gap: 1.25rem;
}

.scroll { display: flex; align-items: center; gap: 0.5rem; }
.scroll-line { width: 20px; height: 1px; background: var(--accent); opacity: 0.4; }
</style>
</head>
<body>
<section class="hero">
  <div class="side-panel"></div>

  <header class="header">
    <span class="brand">OAKLET</span>
    <nav class="nav">
      <a href="#">Каталог</a><a href="#">О бренде</a><a href="#">Контакты</a>
    </nav>
  </header>

  <div class="upper">
    <div class="bg-text">OAKLET</div>
    <div class="upper-content">
      <div class="eyebrow">Тула · Россия · Since 2021</div>
      <h1 class="title">Для<br><em>тульских.</em></h1>
    </div>
  </div>

  <div class="lower">
    <div class="separator"></div>
    <div class="lower-content">
      <p class="sub">Бренд одежды, вдохновлённый историей города. Ограниченные тиражи — продажа через ВКонтакте и Telegram.</p>
      <div class="right-col">
        <div class="ctas">
          <a href="#" class="btn-primary">Каталог →</a>
          <a href="#" class="btn-secondary">О бренде</a>
        </div>
        <div class="meta">
          <span>OAKLET · Тула · 2021</span>
          <div class="scroll"><div class="scroll-line"></div>Scroll</div>
        </div>
      </div>
    </div>
  </div>
</section>
</body>
</html>
