<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hero V2 — Big Type</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,600;0,700;1,300;1,400;1,700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { font-family: 'Inter', sans-serif; background: #FAFAF8; }
a { text-decoration: none; color: inherit; }

.hero {
  min-height: 100svh;
  display: flex;
  flex-direction: column;
  padding: 0 clamp(1.5rem, 5vw, 3.5rem);
  overflow: hidden;
  position: relative;
}

/* Top nav-like bar */
.top-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 1.75rem 0;
  border-bottom: 1px solid rgba(17,17,17,0.07);
  flex-shrink: 0;
}

.top-brand {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.375rem;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: #111;
}

.top-meta {
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: #888882;
  display: flex;
  gap: 1.25rem;
}

/* Main content: big type fills the space */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 3rem 0 1.5rem;
  position: relative;
}

/* The giant title */
.title {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(7rem, 18vw, 19rem);
  font-weight: 700;
  letter-spacing: -0.03em;
  line-height: 0.87;
  color: #111111;
  margin-bottom: 0;
}

.title-line2 {
  font-style: italic;
  font-weight: 300;
  display: block;
  color: #111111;
  padding-left: 0.06em;
}

/* Small copy + ctas on the right, aligned to bottom of title */
.bottom-row {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 2rem;
  margin-top: 2.5rem;
  padding-top: 1.75rem;
  border-top: 1px solid rgba(17,17,17,0.07);
  flex-wrap: wrap;
}

.copy-col {
  max-width: 380px;
}

.eyebrow {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: #888882;
  margin-bottom: 0.75rem;
}

.sub {
  font-size: 0.9375rem;
  color: #4A4A46;
  line-height: 1.65;
}

.ctas {
  display: flex;
  gap: 0.625rem;
  flex-wrap: wrap;
  flex-shrink: 0;
}

.btn-primary {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.875rem 2rem;
  background: #111111;
  color: #FAFAF8;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  border-radius: 6px;
}
.btn-primary:hover { background: #333; }

.btn-secondary {
  display: inline-flex;
  align-items: center;
  padding: 0.875rem 2rem;
  border: 1px solid rgba(17,17,17,0.15);
  color: #4A4A46;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  border-radius: 6px;
}

/* Big outline number top-right — year */
.bg-year {
  position: absolute;
  top: -0.15em;
  right: -0.03em;
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(14rem, 30vw, 32rem);
  font-weight: 700;
  letter-spacing: -0.04em;
  line-height: 1;
  color: transparent;
  -webkit-text-stroke: 1px rgba(17,17,17,0.055);
  user-select: none;
  pointer-events: none;
  z-index: 0;
}

.main > *:not(.bg-year) { position: relative; z-index: 1; }
</style>
</head>
<body>
<section class="hero">
  <div class="top-bar">
    <div class="top-brand">OAKLET</div>
    <div class="top-meta">
      <span>Тула</span>
      <span>·</span>
      <span>2021</span>
      <span>·</span>
      <span>Streetwear</span>
    </div>
  </div>

  <div class="main">
    <div class="bg-year">2021</div>

    <h1 class="title">
      Для<br>
      <span class="title-line2">тульских.</span>
    </h1>

    <div class="bottom-row">
      <div class="copy-col">
        <div class="eyebrow">Тула · Россия · Since 2021</div>
        <p class="sub">Одежда, вдохновлённая историей города. Ограниченные тиражи. Онлайн-продажа через ВКонтакте и Telegram.</p>
      </div>
      <div class="ctas">
        <a href="#" class="btn-primary">Каталог →</a>
        <a href="#" class="btn-secondary">О бренде</a>
      </div>
    </div>
  </div>
</section>
</body>
</html>
